# ───────────── Images (§5.3) ─────────────
# Every single-image preset reads {in}[0] (first frame/page). Inputs are staged as in-N.<ext>.
[[preset]]
id = "image-jpg"
label = "JPG"
description = "JPEG photo"
icon = "image"
kinds = ["image"]
engine = "imagemagick"
bin = "magick"
stage_inputs = true
out_ext = "jpg"
out_naming = "replace_ext"
passes = [['{in}[0]', '-auto-orient', '-background', 'white', '-alpha', 'remove', '-alpha', 'off', '-quality', '{setting.quality.jpg_q}', '{out}']]

[[preset]]
id = "image-png"
label = "PNG"
description = "Lossless · PNG"
icon = "image"
kinds = ["image"]
engine = "imagemagick"
bin = "magick"
stage_inputs = true
out_ext = "png"
out_naming = "replace_ext"
passes = [['{in}[0]', '-auto-orient', '{out}']]

[[preset]]
id = "image-webp"
label = "WebP"
description = "Small for the web · WebP"
icon = "globe"
kinds = ["image"]
engine = "imagemagick"
bin = "magick"
stage_inputs = true
out_ext = "webp"
out_naming = "replace_ext"
passes = [['{in}[0]', '-auto-orient', '-quality', '{setting.quality.webp_q}', '{out}']]

[[preset]]
id = "image-avif"
label = "AVIF"
description = "Smallest · AVIF"
icon = "image"
kinds = ["image"]
engine = "imagemagick"
bin = "magick"
stage_inputs = true
out_ext = "avif"
out_naming = "replace_ext"
passes = [['{in}[0]', '-auto-orient', '-quality', '{setting.quality.avif_q}', '{out}']]

[[preset]]
id = "image-shrink"
label = "Shrink"
description = "Smaller, same format"
icon = "shrink"
kinds = ["image"]
engine = "imagemagick"
bin = "magick"
stage_inputs = true
keep_same_format = true
discard_if_not_smaller = true
skip_formats = ["gif", "ico"]
out_ext = "same"
out_naming = "suffix:compressed"
passes = [['{in}[0]', '-auto-orient', '-resize', '{setting.shrink.image_px}x{setting.shrink.image_px}>', '-define', 'png:compression-filter=5', '-define', 'png:compression-level=9', '-quality', '80', '{out}']]

[[preset]]
id = "image-jxl"
label = "JPEG XL"
description = "JPEG XL"
icon = "image"
kinds = ["image"]
engine = "imagemagick"
bin = "magick"
stage_inputs = true
out_ext = "jxl"
out_naming = "replace_ext"
passes = [['{in}[0]', '-auto-orient', '{out}']]

[[preset]]
id = "image-ico"
label = "ICO"
description = "Windows icon (16–256 px)"
icon = "grid"
kinds = ["image"]
engine = "imagemagick"
bin = "magick"
stage_inputs = true
out_ext = "ico"
out_naming = "replace_ext"
passes = [['{in}[0]', '-auto-orient', '-background', 'none', '-resize', '256x256', '-gravity', 'center', '-extent', '256x256', '-define', 'icon:auto-resize=256,48,32,16', '{out}']]

[[preset]]
id = "image-tiff"
label = "TIFF"
description = "TIFF"
icon = "image"
kinds = ["image"]
engine = "imagemagick"
bin = "magick"
stage_inputs = true
out_ext = "tiff"
out_naming = "replace_ext"
passes = [['{in}[0]', '-auto-orient', '{out}']]

[[preset]]
id = "image-pdf"
label = "PDF"
description = "Image as a PDF page"
icon = "doc"
kinds = ["image"]
engine = "imagemagick"
bin = "magick"
stage_inputs = true
hide_when_multi = true
out_ext = "pdf"
out_naming = "replace_ext"
passes = [['{in}[0]', '-auto-orient', '{out}']]

[[preset]]
id = "image-combine-pdf"
label = "Combine"
description = "Combine into one PDF"
icon = "stack"
kinds = ["image"]
min_files = 2
engine = "imagemagick"
bin = "magick"
stage_inputs = true
out_ext = "pdf"
out_naming = "fixed:combined"
passes = [['{inputs}[0]', '-auto-orient', '{out}']]

# ───────────── PDF (§5.4) ─────────────
[[preset]]
id = "pdf-compress"
label = "Compress"
description = "Smaller PDF"
icon = "shrink"
kinds = ["pdf"]
engine = "ghostscript"
bin = "gswin64c"
progress = "ghostscript_pages"
stage_inputs = true
keep_same_format = true
discard_if_not_smaller = true
out_ext = "pdf"
out_naming = "suffix:compressed"
passes = [['-dNOPAUSE', '-dBATCH', '-dSAFER', '-sDEVICE=pdfwrite', '-dPDFSETTINGS=/ebook', '-dCompatibilityLevel=1.5', '-sOutputFile={out}', '{in}']]

[[preset]]
id = "pdf-images"
label = "Images"
description = "Each page as a PNG"
icon = "image"
kinds = ["pdf"]
engine = "ghostscript"
bin = "gswin64c"
progress = "ghostscript_pages"
stage_inputs = true
out_ext = "png"
out_naming = "folder:pages"
passes = [['-dNOPAUSE', '-dBATCH', '-dSAFER', '-sDEVICE=png16m', '-r150', '-sOutputFile={out_dir}\page-%03d.png', '{in}']]

[[preset]]
id = "pdf-split"
label = "Split"
description = "One PDF per page"
icon = "split"
kinds = ["pdf"]
engine = "qpdf"
bin = "qpdf"
ok_exit = [0, 3]
keep_same_format = true
out_ext = "pdf"
out_naming = "folder:pages"
passes = [['{in}', '--split-pages', '{out_dir}\page-%d.pdf']]

[[preset]]
id = "pdf-merge"
label = "Merge"
description = "Merge into one PDF"
icon = "stack"
kinds = ["pdf"]
min_files = 2
engine = "qpdf"
bin = "qpdf"
ok_exit = [0, 3]
out_ext = "pdf"
out_naming = "fixed:merged"
passes = [['--empty', '--pages', '{inputs}', '--', '{out}']]


[package]
name = "recast"
version = "0.1.0"
description = "Recast file converter"
authors = ["Patrick Ackom"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "recast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
toml = "1.2.1"
infer = "0.22.0"
dirs = "7.0.0"
flexi_logger = "0.31.10"
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.29.3", features = ["v4"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_LibraryLoader"] }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[features]
# Runs tests/engines_integration.rs against real, downloaded engines.
engines = []

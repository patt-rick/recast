# Checks pushes to master and every pull request: the same checks as a local run
# (README "Develop"). The real-engine tests (`--features engines`, ~250 MB of
# downloads) are not run here.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install front-end dependencies
        run: npm ci

      - name: Front-end tests
        run: npm test

      # Also produces dist/, which the Rust build embeds (tauri.conf.json frontendDist).
      - name: Front-end build (tsc + vite)
        run: npm run build

      # Pinned, so a new stable release can't start failing clippy on its own.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # Builds examples/fake_engine.rs first; the 2 desktop-only mouse-hook tests stay ignored.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
